set -g prefix C-F12
unbind C-b

set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

set -g base-index 1
set -g renumber-windows on
set -g status off

set -g tree-mode-border-style bg=default,fg=themelightgrey

bind -n C-j last-windo
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"

bind & confirm-before -y -p "kill-window #W? (y/n)" kill-window
bind x confirm-before -y -p "kill-pane #{pane_current_command}? (y/n)" kill-pane

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g set-titles on
set -g set-titles-string "#{?#{>:#{session_windows},1},[#{active_window_index}/#{session_windows}] ,}#{?#{==:#{pane_current_command},nvim},#{pane_title},#{s|^/home/[^/]+|~|:pane_current_path}}"

