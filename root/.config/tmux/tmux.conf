#- TITLE: General ------------------------------------------------------------------------

set -g prefix C-F12
unbind C-b

set -g focus-events on
set -g detach-on-destroy off
set -g history-limit 5000
set -gq allow-passthrough on

#- TITLE: Keybindings --------------------------------------------------------------------

bind -n C-j last-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"

bind & confirm-before -y -p "kill-window #W? (y/n)" kill-window
bind x confirm-before -y -p "kill-pane #{pane_current_command}? (y/n)" kill-pane

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

#- TITLE: Copy Mode ----------------------------------------------------------------------

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

#- TITLE: Appearance ---------------------------------------------------------------------

set -g base-index 1
set -g renumber-windows on

set -g status off
set -g set-titles on
set -g set-titles-string "#{?#{>:#{session_windows},1},[#{active_window_index}/#{session_windows}] ,}#{?#{==:#{pane_current_command},nvim},#{pane_title},#{s|^/home/[^/]+|~|:pane_current_path}}"

#- TITLE: Theming ------------------------------------------------------------------------

if -F '#{==:#{client_theme},light}' \
  'source-file ~/.config/tmux/light.conf' \
  'source-file ~/.config/tmux/dark.conf'

set-hook -g client-dark-theme  'source-file ~/.config/tmux/dark.conf'
set-hook -g client-light-theme 'source-file ~/.config/tmux/light.conf'
