gui:
  border: single
  showBottomLine: false
  showCommandLog: false
  showPanelJumps: false
  colorScheme: dark
  theme:
    authorColors:
      'Darian Toledo': 'cyan'
  darkTheme:
    selectedLineBgColor:
      - "#303030"
    inactiveViewSelectedLineBgColor:
      - "#262626"
    inactiveBorderColor:
      - "#5F5F5F"
  lightTheme:
    selectedLineBgColor:
      - "#C9C9BF"
    inactiveViewSelectedLineBgColor:
      - "#E0E0D5"
    inactiveBorderColor:
      - "#7F7F7F"
notARepository: 'quit'
customCommands:
  - key: "w"
    command: "cz; true"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
git:
  diffRenderers:
    - command: delta --paging=never
    - name: default
      type: rawGit
