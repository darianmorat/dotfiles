gui:
  border: single
  showBottomLine: false
  showCommandLog: false
  showPanelJumps: false
  colorScheme: dark
  theme:
    authorColors:
      'Darian Toledo': 'cyan'
  darkTheme:
    selectedLineBgColor:
      - "#303030"
    inactiveViewSelectedLineBgColor:
      - "#272727"
    inactiveBorderColor:
      - "#5f5f5f"
  lightTheme:
    selectedLineBgColor:
      - "#cccccc"
    inactiveViewSelectedLineBgColor:
      - "#e0e0e0"
    inactiveBorderColor:
      - "#7f7f7f"
notARepository: 'quit'
customCommands:
  - key: "w"
    command: "cz; true"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
git:
  diffRenderers:
    - command: delta --paging=never
    - name: default
      type: rawGit
