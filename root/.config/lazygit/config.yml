gui:
  authorColors:
    'Darian Toledo': 'cyan'
  border: single
  showBottomLine: false
  showCommandLog: false
  showPanelJumps: false
  theme:
    selectedLineBgColor:
      - "#303030"
      - bold
notARepository: 'quit'
customCommands:
  - key: "w"
    command: "git cz; true"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
git:
  diffRenderers:
    - type: extDiff
      command: difft --color=always --display=inline --syntax-highlight=off --context={{diffContext}}
    - name: default
      type: rawGit
